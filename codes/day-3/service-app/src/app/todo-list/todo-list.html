@if(!isRequestOver()){
<span>Loading...</span>
}@else if (errorInfo()!=='') {
<span>{{errorInfo()}}</span>
}@else if (todos().length===0) {
<span>no recoeds</span>
}@else {
<ul>
    @for(todo of todos();track todo.id){
    <li (click)="selectedTodoId.set(todo.id)">
        <u>
            {{todo.title}}&nbsp;
            <input type="checkbox" name="" id="" [checked]="todo.completed">
        </u>
    </li>
    }
</ul>
}
<br>
@if(selectedTodoId()>0){
<app-todo-info [todoId]="selectedTodoId()"></app-todo-info>
}@else {
    <span>select a title to view the details</span>
}
